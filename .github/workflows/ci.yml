name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  MIX_ENV: test

permissions:
  contents: read

jobs:
  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.20"
            otp: "29"
            lint: true
          - elixir: "1.19"
            otp: "28"
          - elixir: "1.18"
            otp: "27"
          # Oldest supported combination.
          - elixir: "1.18"
            otp: "25"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            typedb/deps
            typedb/_build
          key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      - name: Test (default transport)
        run: mix test

      - name: Test every HTTP adapter
        run: |
          for adapter in finch req httpc; do
            echo "--- $adapter ---"
            TYPEDB_TEST_ADAPTER=$adapter mix test
          done

      # CONTRIBUTING asks contributors to run both before opening a PR. Until
      # now nothing enforced either, so "the gate" was a request rather than a
      # gate. The release workflow runs the same two.
      #
      # MIX_ENV: dev on both, overriding the workflow-level `test` — credo and
      # dialyxir are `only: [:dev]` deps, so under `test` the tasks do not exist
      # and the step fails with "The task could not be found".
      # After the adapter loop, so a coverage failure is reported as a coverage
      # failure rather than as "the suite is red". The floor is in mix.exs; see
      # its `test_coverage` for what is excluded and why.
      - name: Coverage floor
        if: matrix.lint
        run: mix test --cover

      - name: Lint
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix credo --strict

      - name: Cache the dialyzer PLT
        if: matrix.lint
        uses: actions/cache@v4
        with:
          path: typedb/_build/dev/*.plt*
          key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Typecheck
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer

  integration:
    name: Integration (TypeDB ${{ matrix.typedb }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release, the version the driver is developed
        # against, and the newest published. `latest` is here so that a TypeDB
        # release breaks this build before it breaks somebody's application; it
        # is expected to be green, and a failure on it is a real signal rather
        # than noise.
        #
        # 3.12.0 is the floor, established by running this suite down the
        # published releases: 3.11.5 fails fourteen integration tests because
        # TypeQL's `given` stage does not exist there, and 3.5.0 fails more
        # broadly still. It is in the matrix so that the claim in README.md's
        # `Requirements` section stays true rather than becoming folklore.
        # `latest` names the slot, `image` names what it pulls, and they are
        # different on purpose. The tag currently resolves to 3.13.0-rc0, which
        # panics on its own — `Cannot get exclusive ownership of inner of
        # Arc<QueryCache>` out of `database/database.rs` — and takes this job
        # with it on every pull request. So the slot is pinned to the newest
        # release that works, and the job keeps its name: whatever requires
        # this check by name keeps finding it.
        #
        # Undo by putting `latest` back in `image` when 3.13 ships a release
        # that does not panic. Keeping the slot rather than deleting it is the
        # point — a matrix that quietly stops testing the newest server is how
        # this stops being noticed.
        include:
          - typedb: "3.12.0"
            image: "3.12.0"
          - typedb: "3.12.1"
            image: "3.12.1"
          - typedb: "latest"
            image: "3.12.1"

    services:
      typedb:
        image: typedb/typedb:${{ matrix.image }}
        ports:
          - 8000:8000
          - 1729:1729
        # No --health-cmd on purpose: a service health check runs *inside* the
        # container and would depend on what the TypeDB image happens to ship.
        # The "Wait for TypeDB" step below probes from the runner instead.

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - name: Wait for TypeDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "TypeDB did not become healthy in time" >&2
          exit 1

      - name: Run integration tests
        env:
          TYPEDB_INTEGRATION_URL: http://localhost:8000
          TYPEDB_INTEGRATION_USERNAME: admin
          TYPEDB_INTEGRATION_PASSWORD: password
          # Timeout tests spend real seconds waiting; this job already does.
          TYPEDB_SLOW_TESTS: "1"
        run: mix test --include integration

      - name: Run integration tests through every adapter
        env:
          TYPEDB_INTEGRATION_URL: http://localhost:8000
        run: |
          for adapter in finch req httpc; do
            echo "--- $adapter ---"
            TYPEDB_TEST_ADAPTER=$adapter mix test --include integration
          done

  # Two suites that verify headline claims and that no service container can
  # start, because a service container's command cannot be overridden and both
  # need server flags: a five-second token lifetime, and TLS. They were run by
  # hand until 0.4.1, which is another way of saying they were run when someone
  # remembered. `docker run` in an ordinary step has no such limitation.
  token_renewal:
    name: Token renewal (five-second tokens)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - name: Start TypeDB with a five-second token lifetime
        run: |
          # The image's entrypoint is already `typedb server …`, so everything
          # here is appended as flags — `server` must not be repeated. HTTP is
          # on by default, which is what the integration job's service
          # container relies on too.
          docker run -d --name typedb-short-token -p 8001:8000 typedb/typedb:3.12.1 \
            --server.authentication.token-expiration-seconds 5

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8001/health; then exit 0; fi
            sleep 2
          done

          echo "TypeDB did not become healthy in time" >&2
          docker logs typedb-short-token
          exit 1

      # `--include integration` and both env vars, or the suite skips itself and
      # the job goes green having run nothing — which is the exact failure this
      # job exists to end, so it is asserted rather than assumed.
      - name: Run the token renewal suite
        env:
          TYPEDB_SHORT_TOKEN_URL: http://localhost:8001
          TYPEDB_SHORT_TOKEN_SECONDS: "5"
        run: |
          set -o pipefail
          mix test test/integration/token_renewal_integration_test.exs --include integration \
            | tee /tmp/token-renewal.log

          if grep -q "skipped" /tmp/token-renewal.log; then
            echo "the token renewal suite skipped itself — check TYPEDB_SHORT_TOKEN_URL" >&2
            exit 1
          fi

  tls:
    name: TLS defaults
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      # The suite's own moduledoc carries these invocations; they are here so
      # that the instructions are executed rather than merely written down.
      - name: Mint a CA and a server certificate
        run: |
          mkdir -p certs && cd certs
          openssl req -x509 -newkey rsa:2048 -keyout ca.key -out ca.pem -days 30 -nodes \
            -subj "/CN=TypeDB Test CA"
          openssl req -newkey rsa:2048 -keyout server.key -out server.csr -nodes \
            -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out server.pem -days 30 -extfile ext.cnf
          chmod a+r server.key server.pem

      # A second name pointing at the same server, so the hostname-mismatch
      # test runs instead of skipping itself. It is the one assertion here that
      # is about an attack rather than about configuration.
      - name: Point a name the certificate does not cover at the server
        run: echo "127.0.0.1 wronghost.test" | sudo tee -a /etc/hosts

      - name: Start TypeDB with TLS
        run: |
          docker run -d --name typedb-tls -p 8443:8000 \
            -v "$PWD/certs:/certs:ro" typedb/typedb:3.12.1 \
            --server.encryption.enabled true \
            --server.encryption.certificate /certs/server.pem \
            --server.encryption.certificate-key /certs/server.key

          for _ in $(seq 1 60); do
            if curl -fsS --cacert certs/ca.pem https://localhost:8443/health; then exit 0; fi
            sleep 2
          done

          echo "TypeDB did not become healthy in time" >&2
          docker logs typedb-tls
          exit 1

      - name: Run the TLS suite through every adapter
        env:
          TYPEDB_TLS_URL: https://localhost:8443
          TYPEDB_TLS_CACERTFILE: certs/ca.pem
          TYPEDB_TLS_WRONG_HOST_URL: https://wronghost.test:8443
        run: |
          set -o pipefail

          for adapter in finch req httpc; do
            echo "--- $adapter ---"
            TYPEDB_TEST_ADAPTER=$adapter \
              mix test --include tls test/integration/tls_integration_test.exs | tee /tmp/tls.log

            # Same reasoning as the token-renewal job: this suite skips itself
            # without its environment, and a skip that reports success is worse
            # than no job at all. The hostname-mismatch test skips on its own
            # too, when TYPEDB_TLS_WRONG_HOST_URL is unset.
            if grep -q "skipped" /tmp/tls.log; then
              echo "the TLS suite skipped a test — check TYPEDB_TLS_* for $adapter" >&2
              exit 1
            fi
          done

  restart:
    name: Server restart
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      # Its own server, on its own port, because this job stops it mid-run and
      # the integration job's service container is shared.
      - name: Start a TypeDB this job is allowed to kill
        run: |
          docker run -d --name typedb-restart -p 8002:8000 typedb/typedb:3.12.1

          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8002/health; then exit 0; fi
            sleep 2
          done

          echo "TypeDB did not become healthy in time" >&2
          docker logs typedb-restart
          exit 1

      # Every adapter, because what a dead pool does is the adapter's business:
      # Finch, Req and httpc pool connections differently and only running all
      # three shows that a restart costs the caller nothing on any of them.
      - name: Run the restart suite through every adapter
        env:
          TYPEDB_RESTART_URL: http://localhost:8002
          TYPEDB_RESTART_STOP: docker stop typedb-restart
          TYPEDB_RESTART_START: docker start typedb-restart
        run: |
          set -o pipefail

          for adapter in finch req httpc; do
            echo "--- $adapter ---"
            TYPEDB_TEST_ADAPTER=$adapter mix test --include integration \
              test/integration/restart_integration_test.exs | tee /tmp/restart.log

            # Without its environment this suite skips itself, and a skip that
            # reports success is the failure the token-renewal job also guards.
            if grep -q "skipped" /tmp/restart.log; then
              echo "the restart suite skipped itself — check TYPEDB_RESTART_* for $adapter" >&2
              exit 1
            fi
          done

  windows:
    name: Windows (compile and unit tests)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: typedb

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      # `mix typedb.check` needs a POSIX shell, by decision — Git Bash, WSL or
      # MSYS2 cover it, and the task says so. The driver itself is pure Elixir
      # and should be proven to work here rather than assumed to: the unit suite
      # is hermetic, driving the whole driver against an in-process HTTP server.
      # The typeql-check tests skip themselves when the CLI is absent, which it
      # is here.
      #
      # No formatting or lint check: those run once, on Linux.
      - run: mix compile --warnings-as-errors

      - run: mix test

      - name: Test every HTTP adapter
        shell: bash
        run: |
          for adapter in finch req httpc; do
            echo "--- $adapter ---"
            TYPEDB_TEST_ADAPTER=$adapter mix test
          done

  optional_deps:
    name: Optional dependencies (${{ matrix.name }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: none
            with_optional: ""
          - name: all
            with_optional: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      # `finch`, `req`, `decimal` and `jason` are optional dependencies of this
      # package, and optional dependencies are not fetched for consumers — so a
      # throwaway app that depends on the driver is the only place they can
      # genuinely be absent. The one bug that reached hex was exactly this: a
      # `%Finch.Response{}` struct pattern that made the package fail to compile
      # for anyone without finch, invisible to a matrix varying only Elixir and
      # OTP. `@compile {:no_warn_undefined, ...}` does not cover a struct
      # pattern, because that is expanded at compile time.
      - name: Compile and run a consumer application
        working-directory: typedb/test/support/consumer
        env:
          # The packages live in `typedb/` and `typedb_grpc/`; the workspace
          # root has no mix.exs, so pointing the consumer's path dependency at
          # it fails before the driver is even compiled. The default in the
          # consumer's own mix.exs — `"../../.."` — is already right; only this
          # override was wrong.
          TYPEDB_PATH: ${{ github.workspace }}/typedb
          WITH_OPTIONAL: ${{ matrix.with_optional }}
        run: |
          mix deps.get
          mix compile --warnings-as-errors
          mix run smoke.exs

  typeql:
    name: TypeQL syntax
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      # Pinned tarball rather than the apt repository: the pool serves one URL
      # per version across architectures, so apt can pick the wrong build.
      - name: Install typeql-check
        env:
          TYPEQL_CHECK_VERSION: "3.12.0"
        run: |
          name="typeql-check-linux-x86_64"
          curl -fsSL -o typeql-check.tar.gz \
            "https://repo.typedb.com/public/public-release/raw/names/${name}/versions/${TYPEQL_CHECK_VERSION}/${name}-${TYPEQL_CHECK_VERSION}.tar.gz"
          tar xzf typeql-check.tar.gz
          sudo install -m755 "${name}-${TYPEQL_CHECK_VERSION}/typeql-check" /usr/local/bin/typeql-check
          # Single-quoted: the shell must not expand the TypeQL variable $p.
          typeql-check 'match $p isa person;'

      - run: mix deps.get

      - run: mix typedb.check

      # The task's own tests, which need the CLI installed above and are skipped
      # everywhere it is not. They cover the shelling-out: an over-ARG_MAX
      # schema, a filename full of shell metacharacters, and a missing shell.
      - name: Test the mix task itself
        run: mix test test/mix/typedb_check_test.exs

  # ---------------------------------------------------------------------------
  # typedb_grpc. Its own gate, mirroring the one above, plus the two things only
  # this package can get wrong: the committed protocol modules going stale, and
  # the two drivers drifting apart.
  # ---------------------------------------------------------------------------

  grpc_test:
    name: gRPC unit (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    strategy:
      fail-fast: false
      matrix:
        # A narrower matrix than the sibling's on purpose: `:grpc` and
        # `:protobuf` set the floor here, not this code, and widening it would
        # be testing their support rather than ours.
        include:
          - elixir: "1.20"
            otp: "29"
          - elixir: "1.18"
            otp: "27"

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - uses: actions/cache@v4
        with:
          path: |
            typedb_grpc/deps
            typedb_grpc/_build
          key: ${{ runner.os }}-grpc-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: ${{ runner.os }}-grpc-${{ matrix.elixir }}-${{ matrix.otp }}-

      # `typedb` is a path dependency here, so the sibling directory has to be
      # there — it is, from the checkout above.
      - run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile without warnings
        run: mix compile --warnings-as-errors

      # No server configured, so the integration tests skip. What runs is the
      # error mapping and the protocol assertions, which need none.
      - name: Run unit tests
        run: mix test

      # MIX_ENV: dev, overriding the workflow-level `test`, for the same reason
      # the Dialyzer step below and the sibling `typedb` job both do it: credo
      # is an `only: [:dev]` dependency, so under `test` the task does not
      # exist and the step fails with "The task could not be found".
      - name: Credo
        env:
          MIX_ENV: dev
        run: mix credo --strict

      - uses: actions/cache@v4
        if: matrix.elixir == '1.20'
        with:
          path: typedb_grpc/_build/dev/*.plt*
          key: ${{ runner.os }}-grpc-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-grpc-plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Dialyzer
        if: matrix.elixir == '1.20'
        env:
          MIX_ENV: dev
        run: mix dialyzer

  grpc_generated:
    name: Generated protocol is what the task produces
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - run: mix deps.get

      - name: Install protoc-gen-elixir
        run: |
          mix escript.install hex protobuf --force
          echo "$HOME/.mix/escripts" >> "$GITHUB_PATH"

      # `lib/protocol` is committed so that installing this package needs no
      # protoc. The cost of that is that it can be edited by hand, or fall
      # behind the version it claims — both of which this catches, because the
      # task is deterministic and the version comes from the code itself.
      - name: Regenerate and diff
        run: |
          version="$(mix run --no-start -e 'IO.puts(TypeDB.GRPC.Protocol.version())' | tail -n1)"
          echo "Regenerating from typedb-protocol $version"
          mix typedb.grpc.gen "$version"
          if ! git diff --exit-code -- lib/protocol; then
            echo >&2
            echo "lib/protocol differs from what 'mix typedb.grpc.gen $version' produces." >&2
            echo "Either it was edited by hand, or it was generated from another version." >&2
            echo "Run the task and commit the result." >&2
            exit 1
          fi

  grpc_integration:
    name: gRPC integration (TypeDB ${{ matrix.typedb }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    strategy:
      fail-fast: false
      matrix:
        # `latest` names the slot, `image` names what it pulls, and they are
        # different on purpose. The tag currently resolves to 3.13.0-rc0, which
        # panics on its own — `Cannot get exclusive ownership of inner of
        # Arc<QueryCache>` out of `database/database.rs` — and takes this job
        # with it on every pull request. So the slot is pinned to the newest
        # release that works, and the job keeps its name: whatever requires
        # this check by name keeps finding it.
        #
        # Undo by putting `latest` back in `image` when 3.13 ships a release
        # that does not panic. Keeping the slot rather than deleting it is the
        # point — a matrix that quietly stops testing the newest server is how
        # this stops being noticed.
        include:
          - typedb: "3.12.1"
            image: "3.12.1"
          - typedb: "latest"
            image: "3.12.1"

    services:
      typedb:
        image: typedb/typedb:${{ matrix.image }}
        ports:
          - 8000:8000
          - 1729:1729

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      # Probed over HTTP even though this package speaks gRPC: the HTTP port
      # answers a plain GET, and a gRPC readiness probe from a shell would mean
      # installing a gRPC client to find out whether the gRPC client works.
      - name: Wait for TypeDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "TypeDB did not become healthy in time" >&2
          exit 1

      - name: Run integration tests
        env:
          TYPEDB_GRPC_ADDRESS: localhost:1729
          TYPEDB_GRPC_USERNAME: admin
          TYPEDB_GRPC_PASSWORD: password
        run: mix test --include integration

  behaviour:
    name: Both drivers agree (TypeDB ${{ matrix.typedb }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    strategy:
      fail-fast: false
      matrix:
        # `latest` names the slot, `image` names what it pulls, and they are
        # different on purpose. The tag currently resolves to 3.13.0-rc0, which
        # panics on its own — `Cannot get exclusive ownership of inner of
        # Arc<QueryCache>` out of `database/database.rs` — and takes this job
        # with it on every pull request. So the slot is pinned to the newest
        # release that works, and the job keeps its name: whatever requires
        # this check by name keeps finding it.
        #
        # Undo by putting `latest` back in `image` when 3.13 ships a release
        # that does not panic. Keeping the slot rather than deleting it is the
        # point — a matrix that quietly stops testing the newest server is how
        # this stops being noticed.
        include:
          - typedb: "3.12.1"
            image: "3.12.1"
          - typedb: "latest"
            image: "3.12.1"

    services:
      typedb:
        image: typedb/typedb:${{ matrix.image }}
        ports:
          - 8000:8000
          - 1729:1729

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - name: Wait for TypeDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "TypeDB did not become healthy in time" >&2
          exit 1

      # The reason the two packages share a repository. Both endpoints are set
      # deliberately: the suite warns when it runs against half the matrix, and
      # a job that only ever exercised one transport would prove nothing about
      # the two agreeing.
      - name: Run the shared behaviour suite
        env:
          TYPEDB_INTEGRATION_URL: http://localhost:8000
          TYPEDB_INTEGRATION_USERNAME: admin
          TYPEDB_INTEGRATION_PASSWORD: password
          TYPEDB_GRPC_ADDRESS: localhost:1729
          TYPEDB_GRPC_USERNAME: admin
          TYPEDB_GRPC_PASSWORD: password
        run: mix test --include integration test/behaviour

  grpc_tls:
    name: gRPC TLS defaults
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    # No service container: this needs server flags, and a service container's
    # command cannot be overridden. `docker run` in an ordinary step can.
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - name: Mint a CA and a server certificate
        run: |
          mkdir -p tls && cd tls
          openssl req -x509 -newkey rsa:2048 -keyout ca.key -out ca.pem -days 1 -nodes \
            -subj "/CN=TypeDB Test CA"
          openssl req -newkey rsa:2048 -keyout server.key -out server.csr -nodes \
            -subj "/CN=localhost"
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial \
            -out server.pem -days 1 -extfile ext.cnf

      - name: Start TypeDB with encryption on
        run: |
          docker run -d --name typedb-tls \
            -p 8443:8443 -p 1730:1730 \
            -v "$PWD/tls:/tls:ro" \
            typedb/typedb:3.12.1 \
            --server.http.enabled true --server.http.listen-address 0.0.0.0:8443 \
            --server.address 0.0.0.0:1730 \
            --server.encryption.enabled true \
            --server.encryption.certificate /tls/server.pem \
            --server.encryption.certificate-key /tls/server.key

          for i in $(seq 1 60); do
            if openssl s_client -connect 127.0.0.1:1730 -CAfile tls/ca.pem </dev/null 2>&1 \
               | grep -q "Verify return code: 0"; then
              exit 0
            fi
            sleep 2
          done
          echo "TypeDB did not come up with TLS in time" >&2
          docker logs typedb-tls >&2
          exit 1

      # The assertion this job exists for is the negative one: a certificate
      # signed by a CA the runner does not trust must be refused. A driver that
      # verified nothing would pass every other test in the suite.
      - name: Run the TLS suite
        env:
          TYPEDB_GRPC_TLS_ADDRESS: localhost:1730
          TYPEDB_GRPC_TLS_CACERTFILE: tls/ca.pem
        run: mix test --include tls test/integration/tls_integration_test.exs

      - name: Server logs on failure
        if: failure()
        run: docker logs typedb-tls

  grpc_migration_interop:
    name: Export files are TypeDB's, not ours (TypeDB ${{ matrix.typedb }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typedb_grpc

    # A job of its own, pinned to one version rather than matrixed over the
    # others, because of what it compares: this driver's dump of a database
    # against the console's dump of the same database, byte for byte. That only
    # means anything when the console is the same version as the server.
    #
    # The console does not come from the image. `typedb/typedb` ships the server
    # alone — `docker export` on it lists `/opt/typedb-server-linux-x86_64/typedb`
    # and no console — so it is fetched from the `typedb-all` distribution, which
    # is the only published artefact that carries one.
    strategy:
      matrix:
        typedb: ["3.12.1"]

    services:
      typedb:
        image: typedb/typedb:${{ matrix.typedb }}
        ports:
          - 8000:8000
          - 1729:1729

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20"
          otp-version: "29"

      - run: mix deps.get

      - name: Wait for TypeDB
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          echo "TypeDB did not become healthy in time" >&2
          exit 1

      - name: Fetch the matching TypeDB console
        run: |
          version="${{ matrix.typedb }}"
          name="typedb-all-linux-x86_64"
          curl -fsSL --retry 3 \
            "https://repo.typedb.com/public/public-release/raw/names/$name/versions/$version/$name-$version.tar.gz" \
            -o typedb-all.tar.gz
          tar -xzf typedb-all.tar.gz
          console="$PWD/$name-$version/typedb"
          test -x "$console"
          echo "TYPEDB_CONSOLE=$console" >> "$GITHUB_ENV"

      # The suite skips the interop test when TYPEDB_CONSOLE is unset, which is
      # right on a developer's machine and would make this job green while
      # proving nothing. Set-but-missing already fails the test; unset here has
      # to fail the job.
      - name: The console has to be there
        run: test -x "$TYPEDB_CONSOLE"

      - name: Run the migration suite against the real console
        env:
          TYPEDB_GRPC_ADDRESS: localhost:1729
          TYPEDB_GRPC_USERNAME: admin
          TYPEDB_GRPC_PASSWORD: password
        run: mix test --include integration test/integration/migration_integration_test.exs
